name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    # GitHub does not expose repository secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Serial builds avoid two Unity Personal activations racing each other.
      max-parallel: 1
      matrix:
        include:
          - display_name: Windows x64
            target_platform: StandaloneWindows64
            artifact_name: release-windows
          - display_name: Android APK
            target_platform: Android
            artifact_name: release-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # GameCI derives player versions from tags and commit history.
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.target_platform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.target_platform }}-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.target_platform }}
          buildName: ThreeInARow
          buildsPath: build
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'Semantic' }}
          androidExportType: androidPackage

      - name: Package Windows build
        if: matrix.target_platform == 'StandaloneWindows64'
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find build -type f -name 'ThreeInARow.exe' -print -quit)"
          test -n "$executable"
          mkdir -p release-assets
          executable_dir="$(dirname "$executable")"
          (cd "$executable_dir" && zip -9 -r "$GITHUB_WORKSPACE/release-assets/ThreeInARow-Windows-x64.zip" .)

      - name: Package Android build
        if: matrix.target_platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/ThreeInARow-Android.apk

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          # The release job downloads artifacts but does not check out the repo.
          # Tell gh which repository to use instead of relying on local Git metadata.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Three in a Row $GITHUB_REF_NAME"
          fi
